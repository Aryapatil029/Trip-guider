<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>To Do List</title>

<script src="bootstrap.bundle.js"></script>
<link rel="stylesheet" href="bootstrap.css"/>

<style>
body{
    background-color:#f8f9fa;
}

.todo-card{
    max-width:700px;
    margin:auto;
}

table td{
    padding:10px;
}

.form-control{
    width:400px;
}
</style>

</head>
<body>

<div class="container-fluid bg-primary text-white text-center py-4 mb-5">
    <h1>Your To Do List</h1>
</div>

<div class="container">

    <div class="card shadow todo-card">

        <div class="card-header bg-dark text-white">
            <h3 class="mb-0">Today's Tasks</h3>
        </div>

        <div class="card-body">

            

            <table class="table table-borderless">

                <tr>
                    <td>
                        <input class="form-check-input" type="checkbox">
                    </td>
                    <td>
                        <input type="text" class="form-control" placeholder="Task 1">
                    </td>
                </tr>

                <tr>
                    <td>
                        <input class="form-check-input" type="checkbox">
                    </td>
                    <td>
                        <input type="text" class="form-control" placeholder="Task 2">
                    </td>
                </tr>

                <tr>
                    <td>
                        <input class="form-check-input" type="checkbox">
                    </td>
                    <td>
                        <input type="text" class="form-control" placeholder="Task 3">
                    </td>
                </tr>

                <tr>
                    <td>
                        <input class="form-check-input" type="checkbox">
                    </td>
                    <td>
                        <input type="text" class="form-control" placeholder="Task 4">
                    </td>
                </tr>

                <tr>
                    <td>
                        <input class="form-check-input" type="checkbox">
                    </td>
                    <td>
                        <input type="text" class="form-control" placeholder="Task 5">
                    </td>
                </tr>

            </table>
            <div class="alert alert-info">
                Mark the checkbox once a task is completed.
            </div>

            <div class="text-center mt-4">
                <input type="submit" value="Task Completed!" class="btn btn-success px-4">
            </div>

        </div>

    </div>

</div>


</body>
</html>

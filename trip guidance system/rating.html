<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Review & Rating</title>

<script src="bootstrap.bundle.js"></script>
<link rel="stylesheet" href="bootstrap.css"/>

<style>
body{
    background-color:#f8f9fa;
}

.review-card{
    max-width:800px;
    margin:auto;
}
</style>

</head>
<body>

<div class="container-fluid bg-primary text-white text-center py-4 mb-5">
    <h1>Review & Rating</h1>
    <p class="mb-0">Share your experience with Trip Guider</p>
</div>

<div class="container">

    <div class="card shadow review-card">

        <div class="card-header bg-dark text-white">
            <h3 class="mb-0">Feedback Form</h3>
        </div>

        <div class="card-body">

            <div class="mb-4">
                <label for="exampleFormControlInput1" class="form-label">
                    Email Address
                </label>
                <input type="email"
                       class="form-control"
                       id="exampleFormControlInput1"
                       placeholder="name@example.com">
            </div>

            <h5>Rate Your Experience</h5>
            <p class="text-muted">
                1 indicates Poor and 5 indicates Excellent.
            </p>

            <div class="d-flex align-items-center gap-4 mb-4">

                <div class="form-check">
                    <input class="form-check-input" type="radio" name="rating" id="rating1">
                    <label class="form-check-label" for="rating1">1</label>
                </div>

                <div class="form-check">
                    <input class="form-check-input" type="radio" name="rating" id="rating2">
                    <label class="form-check-label" for="rating2">2</label>
                </div>

                <div class="form-check">
                    <input class="form-check-input" type="radio" name="rating" id="rating3">
                    <label class="form-check-label" for="rating3">3</label>
                </div>

                <div class="form-check">
                    <input class="form-check-input" type="radio" name="rating" id="rating4">
                    <label class="form-check-label" for="rating4">4</label>
                </div>

                <div class="form-check">
                    <input class="form-check-input" type="radio" name="rating" id="rating5">
                    <label class="form-check-label" for="rating5">5</label>
                </div>

            </div>

            <div class="form-floating mb-4">
                <textarea class="form-control"
                          placeholder="Leave a comment here"
                          id="floatingTextarea"
                          style="height:120px"></textarea>
                <label for="floatingTextarea">Comments</label>
            </div>

            <div class="text-center">
                <button class="btn btn-success px-4" type="submit">
                    Submit Review
                </button>
            </div>

        </div>

    </div>

</div>

</body>
</html>
